<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College time table</title>
    <style>
        body {
font-family: Arial, sans-serif;
background-color: #f4f6f8;
}


h2 {
text-align: center;
}


table {
width: 80%;
margin: 20px auto;
border-collapse: collapse;
background-color: white;
}


th, td {
border: 1px solid #333;
padding: 12px;
text-align: center;
}


th {
background-color: #2c3e50;
color: white;
}
    </style>
</head>
<body>
    <h2>College time table</h2>
<table border="2">
    <tr>
        <th>Day</th>
        <th>9-10</th>
        <th>10-11</th>
        <th>11-12</th>
        <th>12-1</th>
        <th>1-2</th>
    </tr>
    <tr>
        <td>
            monday
        </td>
        <td>math</td>
        <td>physics</td>
        <td rowspan="2">lab</td>
        <td colspan="2">lunch break</td>
    </tr>
    <tr>
                <td>
            monday
        </td>
        <td>phy</td>
        <td>math</td>
        <td>lab</td>
        <td colspan="2">lunch break</td>
    </tr>

    </tr>
</table>    
    
</body>
</html>
