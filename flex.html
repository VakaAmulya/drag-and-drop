<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
       .navbar{
        display: flex;
        justify-content: space-between;
        text-align: center;
        padding:15px 25px;
        background: black;

       }
       .logo{
        color:white;
        font-size:20px;
        font-weight:bold;
       }
       .menu a{
        color:white;
        margin-left: 20px;
        text-decoration: none;
       }
      * {
  box-sizing: border-box;
}

.image-box {
  width: 600px;
  margin: 30px auto;
  padding: 15px;
  border: 2px solid #333;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.row {
  display: flex;
  gap: 10px;
}

.row img {
  flex: 1;
  min-width: 0;      /* prevents overflow */
  height: 120px;
  object-fit: cover;
  border: 1px solid #999;
}


    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MySite</div>
        <div  class="menu">
        <a href="#home">Home</a>
        <a href="#About">Aboutus</a>
        <a href="contact">Contact</a>
        </div>
    </nav>
    <div class="image-box">

    <!-- Row 1 : 3 images -->
    <div class="row">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
    </div>

    <!-- Row 2 : 4 images -->
    <div class="row">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
    </div>

    <!-- Row 3 : 3 images -->
    <div class="row">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
    </div>

  </div>


    
</body>
</html>
