<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid vs Flex</title>

  <style>
    /* ---------- Common Reset ---------- */
    * {
      box-sizing: border-box;
    }

    /* ---------- Navbar (Same as yours) ---------- */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: black;
    }

    .logo {
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .menu a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }

    /* ---------- Image Box ---------- */
    .image-box {
      width: 600px;
      max-width: 100%;
      margin: 30px auto;
      padding: 15px;
      border: 2px solid #333;
      display: grid;
      row-gap: 15px;   /* space between rows */
    }

    /* ---------- GRID ROWS ---------- */

    /* 3 images */
    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    /* 4 images */
    .row-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* ---------- Images ---------- */
    .image-box img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border: 1px solid #999;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">MySite</div>
    <div class="menu">
      <a href="#home">Home</a>
      <a href="#about">Aboutus</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!-- Image Section -->
  <div class="image-box">

    <!-- Row 1 : 3 images -->
    <div class="row-3">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
    </div>

    <!-- Row 2 : 4 images -->
    <div class="row-4">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
    </div>

    <!-- Row 3 : 3 images -->
    <div class="row-3">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
      <img src="./img.img/download.jpg">
    </div>

  </div>

</body>
</html>
